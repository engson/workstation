# tip reload with :config-reload
theme = "varua"

[editor]
true-color = true
color-modes = true
popup-border = "all"
end-of-line-diagnostics = "hint"
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.lsp]
auto-signature-help = false

[editor.whitespace.render]
space = "none"
tab = "all"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"

[keys.normal]
"C-h" = "jump_view_left"
"C-l" = "jump_view_right"
"C-k" = "jump_view_up"
"C-j" = "jump_view_down"
"C-left" = "jump_view_left"
"C-right" = "jump_view_right"
"C-up" = "jump_view_up"
"C-down" = "jump_view_down"
